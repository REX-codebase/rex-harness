<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>REX Harness launch film: compositor</title>
<link rel="stylesheet" href="/src/comp.css">
</head>
<body>
<div id="stage">
  <div id="pic">
    <div class="pl" id="plB"><img alt=""><div class="tagsL"></div></div>
    <div class="pl" id="plA"><img alt=""><div class="tagsL"></div></div>
    <div id="grade"></div>
    <div id="bloom"></div><div id="streakW"></div><div id="streak"></div>
    <div id="slam"><b id="slamWord"></b><i id="slamFlag"></i></div>
    <div id="hud"></div>
    <div id="halt"><b>Stopped.</b><span>the token limit was reached &middot; exit code 3</span></div>
    <div id="card">
      <div id="cardMark"><span class="brand"><span class="rex-word"><span>R</span><span>E</span><span>X</span></span></span><span class="brand__name">Harness</span></div>
      <p id="cardTag"><span class="w">Vast</span> <span class="w">power,</span> <span class="w">held</span> <span class="w"><span class="accent">in orbit.</span></span></p>
      <p id="cardSub">AI coding agents you can supervise, budget and verify.</p>
      <p id="cardMeta"><span>Release 0.1.2</span><span>Open source &middot; MIT OR Apache-2.0</span><span>Local first &middot; No telemetry</span></p>
      <p id="cardUrl">rex-codebase.github.io/rex-harness</p>
    </div>
    <div id="flash"></div>
    <div id="grain"></div>
  </div>
  <div id="subs"></div>
  <div id="fade"></div>
</div>
<script type="module" src="/src/comp.js"></script>
</body>
</html>
