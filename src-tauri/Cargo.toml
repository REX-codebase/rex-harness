[package]
name = "rex-harness"
version = "0.1.2"
description = "REX Harness - desktop interface for the REX general agent"
edition = "2021"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
portable-pty = "0.8"
rex-providers = { path = "../crates/rex-providers" }
rex-search = { path = "../crates/rex-search" }
rex-tools = { path = "../crates/rex-tools" }
rex-ultra = { path = "../crates/rex-ultra" }
rex-preview = { path = "../crates/rex-preview" }
rex-installed-agents = { path = "../crates/rex-installed-agents" }
rex-custody = { path = "../crates/rex-custody" }
rex-mcp = { path = "../crates/rex-mcp" }
rex-fable = { path = "../crates/rex-fable" }
rex-workspace = { path = "../crates/rex-workspace" }
# The native folder dialog: the only way a folder gets added to the ones the
# Terminal, Editor and Git tabs may work in. Used directly, on the main thread,
# rather than through tauri-plugin-dialog: that plugin's releases move the whole
# tauri-utils/wry/tao set, and Tauri refuses to build when the crate versions
# and the npm @tauri-apps packages disagree.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
