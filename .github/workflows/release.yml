name: Release

# Two ways to cut a release:
#
#  * push a tag like v0.1.1 (builds every platform, leaves the release as a draft), or
#  * run this workflow by hand (Actions > Release > Run workflow) with the tag to
#    create. By default that builds and PUBLISHES the Windows installer only.
#
# Either way the `rex` command line is built for Linux, macOS and Windows and
# attached as rex-<target>.tar.gz / .zip with a .sha256 next to each, which is
# what scripts/install.sh downloads.
#
# The tag MUST be `v` + the `version` in src-tauri/tauri.conf.json (which must
# match package.json and src-tauri/Cargo.toml); the first job checks it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.1 (created on this commit if it does not exist)"
        required: true
        default: "v0.1.2"
      all_platforms:
        description: "Also build the macOS and Linux bundles"
        type: boolean
        default: false
      draft:
        description: "Leave the release as a draft instead of publishing it"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Written into the release by the Windows job; the other jobs only add files.
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  windows:
    name: Windows setup wizard (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::tag '$RELEASE_TAG' does not match the app version 'v$version' in src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      # tauri-action runs the frontend build (beforeBuildCommand), compiles the
      # app, builds the NSIS setup wizard (artwork, licence page and options
      # are in src-tauri/tauri.conf.json and src-tauri/installer/), and
      # attaches it to the GitHub Release. No signing certificate exists yet,
      # so the installer is unsigned and SmartScreen will warn on first run.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "REX Harness ${{ env.RELEASE_TAG }}"
          releaseBody: |
            **Windows:** download the `x64-setup.exe` below and run it. It is a normal setup wizard (licence, install location, Start menu, launch at the end).

            The installer is **not code-signed yet**, so Windows SmartScreen may say "Windows protected your PC": click **More info**, then **Run anyway**. Check the download against the `.sha256` file on this page if you want to be sure it is intact.

            **Command line only (Linux x86_64, macOS Apple Silicon):** `curl -fsSL https://raw.githubusercontent.com/REX-codebase/rex-harness/main/scripts/install.sh | sh` installs `rex` after checking its SHA-256. Windows: `rex-x86_64-pc-windows-msvc.zip` below.

            REX Harness is open source under MIT OR Apache-2.0. "Continue with ChatGPT" lets you use your ChatGPT plan instead of an API key. See INSTALL.md for macOS and Linux.
          releaseDraft: ${{ github.event_name == 'push' || inputs.draft }}
          prerelease: false
          args: --bundles nsis

      # A checksum next to the installer, so a download can be verified.
      - name: Publish SHA-256 of the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The Cargo workspace builds into the repository-root target/ (the
          # app crate's own src-tauri/target is only used outside the workspace).
          $dirs = @("target/release/bundle/nsis", "src-tauri/target/release/bundle/nsis") | Where-Object { Test-Path $_ }
          $exe = $dirs | ForEach-Object { Get-ChildItem -Path $_ -Filter *-setup.exe } | Select-Object -First 1
          if (-not $exe) { throw "no setup .exe under target/release/bundle/nsis" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          $sum = Join-Path $env:RUNNER_TEMP "$($exe.Name).sha256"
          "$hash  $($exe.Name)" | Set-Content -Path $sum -Encoding ascii
          Get-Content $sum
          gh release upload "$env:RELEASE_TAG" $sum --clobber --repo "$env:GITHUB_REPOSITORY"

  other-platforms:
    name: Build (${{ matrix.os }})
    needs: windows
    if: github.event_name == 'push' || inputs.all_platforms
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundles: dmg
          - os: ubuntu-22.04
            bundles: appimage deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      # No signing keys are configured, so the macOS dmg is UNSIGNED
      # (Gatekeeper will warn; right-click > Open) and no updater artifacts
      # (.sig / latest.json) are produced.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "REX Harness ${{ env.RELEASE_TAG }}"
          releaseDraft: ${{ github.event_name == 'push' || inputs.draft }}
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

  # The `rex` command line, prebuilt. Always runs (it is small), so the
  # `releases/latest/download/rex-<target>` URLs scripts/install.sh uses exist
  # for every release, not only the ones that built every desktop platform.
  cli:
    name: rex CLI (${{ matrix.target }})
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p rex-cli

      - name: Package, checksum and attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/rex.exe dist/stage/
            archive="rex-$TARGET.zip"
          else
            cp target/release/rex dist/stage/
            archive="rex-$TARGET.tar.gz"
          fi
          cp LICENSE-MIT LICENSE-APACHE dist/stage/
          (
            cd dist/stage
            if [ "$RUNNER_OS" = "Windows" ]; then
              7z a -tzip "../$archive" rex.exe LICENSE-MIT LICENSE-APACHE
            else
              # Members at the archive root (no ./ prefix): install.sh extracts `rex` by name.
              tar -czf "../$archive" rex LICENSE-MIT LICENSE-APACHE
            fi
          )
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$archive" > "$archive.sha256"
            else shasum -a 256 "$archive" > "$archive.sha256"; fi
            cat "$archive.sha256"
          )
          gh release upload "$RELEASE_TAG" "dist/$archive" "dist/$archive.sha256" --clobber --repo "$GITHUB_REPOSITORY"
