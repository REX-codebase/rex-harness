name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The preview/capture integration tests drive a real headless browser
      # (BrowserRuntime probes google-chrome/chromium on PATH).
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: Expose Chrome on PATH for the test suite
        run: sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /usr/local/bin/google-chrome && google-chrome --version
      # tauri::generate_context!() panics at compile time when frontendDist
      # is missing; the frontend job builds the real dist in parallel, so
      # the Rust job only needs the path to exist for clippy/test.
      - name: Stub frontend dist for Tauri context macro
        run: mkdir -p dist
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: Frontend (test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  vscode-extension:
    name: VS Code extension (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: extensions/vscode
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx tsc -p ./ --noEmit

  jetbrains-plugin:
    name: JetBrains plugin (buildPlugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: extensions/jetbrains
        run: gradle buildPlugin --no-daemon

  # Runs the real rex-dev-server against a scripted OpenAI-compatible provider:
  # a key and custom base URL set through the API must reach the agent, a 429
  # is waited out, a 22 s response succeeds, and a stalled run is finished by
  # the final check through passing gates. Self-asserting; exits 1 on failure.
  usage-flow:
    name: Usage flow (real backend, scripted provider)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p rex-mcp --bin rex-dev-server
      - run: python3 verification/usage-flow/e2e-flow.py

  # Real Chromium against the production build: the motion layer's checks
  # (the pill springs and lands, Reduce leaves nothing hidden, :active survives
  # entrance animations, ...), the motion-preference contract script, and the
  # button system (disabled primary, hover/press, Reduce and touch, tier radii,
  # top bar fit, tab contrast, focus ring).
  ui-verification:
    name: UI verification (motion layer, contract and buttons)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the production build
        run: |
          nohup npx vite preview --port 4173 --strictPort --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1
      - run: node verification/motion-ui/verify-motion-ui.mjs
      - run: node verification/motion-settings/verify-motion.mjs
      - run: node verification/buttons/verify-buttons.mjs
