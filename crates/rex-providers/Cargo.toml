[package]
name = "rex-providers"
version = "0.1.1"
edition = "2021"
description = "REX Harness provider core: live model catalogs, credentials, and provider status"
license = "MIT OR Apache-2.0"

[dependencies]
rex-mcp-ext = { path = "../rex-mcp-ext" }
serde = { workspace = true }
serde_json = { workspace = true }
rex-custody = { path = "../rex-custody" }
rex-prompt = { path = "../rex-prompt" }
ureq = { version = "3", default-features = false, features = ["rustls"] }
rex-tools = { path = "../rex-tools" }
rex-search = { path = "../rex-search" }
rex-preview = { path = "../rex-preview" }
url = "2"
base64 = { workspace = true }
regex = "1"
unicode-normalization = "0.1"
# already in the dependency graph through rustls; used for secure randomness,
# SHA-256 (PKCE) and ID-token signature verification
ring = "0.17"


# DPAPI, to encrypt saved credentials at rest on Windows (see src/protect.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
