<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lost in orbit — REX Harness</title>
<meta name="theme-color" content="#06050a">
<link rel="icon" href="/rex-harness/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #06050a; color: #ebe9f3; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; place-items: center; text-align: center; padding: 24px;
    background: radial-gradient(60vmax 60vmax at 50% 45%, rgba(120, 90, 255, .28), transparent 60%), #06050a; }
  .ring { width: 132px; height: 132px; margin: 0 auto 28px; border-radius: 50%; border: 2px solid rgba(169, 154, 247, .55);
    box-shadow: 0 0 60px rgba(124, 96, 255, .45), inset 0 0 40px rgba(124, 96, 255, .35); position: relative; }
  .ring::after { content: ""; position: absolute; inset: 38px; border-radius: 50%; background: radial-gradient(circle, #fff, #a99af7 55%, #4b2fd6); box-shadow: 0 0 30px #8d78ff; }
  h1 { font-size: clamp(34px, 6vw, 56px); letter-spacing: -.04em; margin: 0 0 8px; font-weight: 600; }
  p { color: #aaa3ba; margin: 0 0 26px; }
  a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: linear-gradient(180deg, #f4f1ff, #b9acff); color: #0a090d; font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 2px solid #cfc6ff; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <div class="ring" aria-hidden="true"></div>
    <h1>Lost in orbit.</h1>
    <p>That page isn’t part of this system.</p>
    <a href="/rex-harness/">Back to REX Harness</a>
  </main>
</body>
